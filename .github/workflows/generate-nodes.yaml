name: Generate Node Registry

on:
  push:
    paths:
      - "public/icons/**"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate node registry
        run: npm run generate:nodes

      - name: Commit generated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add components/editor/nodes/registry/index.ts

          git diff --cached --quiet || git commit -m "chore: update generated node registry"

      - name: Push changes
        run: git push
